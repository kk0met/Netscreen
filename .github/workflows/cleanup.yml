name: One-time cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup.yml]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Delete obsolete branch and old runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin --delete jar || true
          for id in 37312969939 37313268773; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" || true
          done
