name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.14.3 --no-daemon
            echo "WRAPPER_GENERATED=1" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: netscreen-${{ github.sha }}
          path: build/libs/*.jar

      - name: Publish development build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/out
          cp build/libs/*.jar /tmp/out/
          if [ "${WRAPPER_GENERATED:-0}" = "1" ]; then
            mkdir -p /tmp/out/wrapper/gradle/wrapper
            cp gradlew gradlew.bat /tmp/out/wrapper/
            cp gradle/wrapper/* /tmp/out/wrapper/gradle/wrapper/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dev-builds
          git rm -rfq .
          rm -rf ./* .gradle build
          cp -r /tmp/out/. .
          printf '# Development builds\n\nUnstable jars built automatically from `main`. For stable versions see [Releases](../../releases).\n' > README.md
          git add -A
          git commit -qm "Development build from ${GITHUB_SHA::7}"
          git push -fq origin dev-builds
